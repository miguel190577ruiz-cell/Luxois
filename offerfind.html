<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OfertFind</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e') no-repeat center/cover;
  color:white;
  text-align:center;
}

/* capa para que se vea mejor */
body::before{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.25);
  top:0;
  left:0;
}

.pantalla{
  position:relative;
  padding:15px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  margin-bottom:10px;
}

/* LOGO */
.logoWrap{
  margin-top:5px;
}

.logoSvg{
  width:100%;
  max-width:340px;
}

.sublogo{
  font-size:20px;
  font-style:italic;
  margin-top:5px;
  font-weight:bold;
}

/* BOTONES */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  margin:20px 0;
}

.boton{
  padding:20px;
  border-radius:18px;
  font-weight:bold;
  font-size:16px;
  box-shadow:0 6px 15px rgba(0,0,0,0.3);
  cursor:pointer;
}

.naranja{background:linear-gradient(#ffb347,#ff8c00);}
.rojo{background:linear-gradient(#ff5e57,#c0392b);}
.azul{background:linear-gradient(#4b7bec,#3867d6);}
.verde{background:linear-gradient(#6ab04c,#2ecc71);}
.morado{background:linear-gradient(#be2edd,#8e44ad);}
.cian{background:linear-gradient(#48c6ef,#00cec9);}

/* DISTANCIA */
.distancias{
  margin-top:10px;
}

.distancias button{
  margin:5px;
  padding:10px 18px;
  border:none;
  border-radius:12px;
  background:linear-gradient(#4b7bec,#3867d6);
  color:white;
  font-weight:bold;
}

/* PUBLICIDAD */
.publicidad{
  display:flex;
  overflow-x:auto;
  gap:12px;
  margin-top:20px;
}

.publicidad img{
  width:140px;
  border-radius:12px;
  box-shadow:0 5px 12px rgba(0,0,0,0.4);
}

/* FOOTER */
.footer{
  margin-top:10px;
  font-size:14px;
}

.footer u{
  color:#4da3ff;
}
</style>
</head>

<body>

<div class="pantalla">

  <div class="topbar">
    <div>📍 Tu ubicación</div>
    <div>Seleccionar idioma ></div>
  </div>

  <!-- LOGO -->
  <div class="logoWrap">
    <svg class="logoSvg" viewBox="0 0 900 260">

      <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%">
          <stop offset="0%" stop-color="#ffd400"/>
          <stop offset="50%" stop-color="#ff9d00"/>
          <stop offset="100%" stop-color="#ff2a2a"/>
        </linearGradient>
      </defs>

      <text x="80" y="135"
        font-size="110"
        font-weight="900"
        font-style="italic"
        fill="white">
        OfertFind
      </text>

      <rect x="80" y="150" width="700" height="10" fill="url(#grad)" rx="5"/>
    </svg>

    <div class="sublogo">¡Ofertas cerca de ti!</div>
  </div>

  <!-- BOTONES -->
  <div class="grid">
    <div class="boton naranja">☕ Desayunar</div>
    <div class="boton rojo">🍴 Comer</div>
    <div class="boton azul">🛍 Comprar</div>
    <div class="boton verde">⚡ Ofertas Express</div>
    <div class="boton morado">🍸 Happy Hour</div>
    <div class="boton cian">🌴 Ocio</div>
  </div>

  <!-- DISTANCIA -->
  <div>
    <h3>¿A qué distancia?</h3>
    <div class="distancias">
      <button>100 m</button>
      <button>500 m</button>
      <button>2 km</button>
    </div>
  </div>

  <!-- PUBLICIDAD -->
  <div class="publicidad">
    <img src="https://images.unsplash.com/photo-1551782450-a2132b4ba21d">
    <img src="https://images.unsplash.com/photo-1551024601-bec78aea704b">
    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e">
  </div>

  <div class="footer">
    ¿Tienes un negocio? <u>Acceso comerciante</u>
  </div>

</div>

</body>
</html>
