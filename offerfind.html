<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OfferFind MVP</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
    }

    /* SPLASH */
    #splash {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .logo-text {
      font-size: 46px;
      font-weight: 800;
      margin-bottom: 30px;
    }

    .pin {
      width: 90px;
      height: 90px;
      background: #fff;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      position: relative;
    }

    .pin::after {
      content: "";
      width: 38px;
      height: 38px;
      background: #000;
      border-radius: 50%;
      position: absolute;
      top: 26px;
      left: 26px;
    }

    /* APP */
    #app {
      display: none;
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      background: #000;
    }

    .offer-card {
      height: 100vh;
      scroll-snap-align: start;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
      background: linear-gradient(to top, #000 20%, #222 100%);
    }

    .media-placeholder {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #111, #333);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 20px;
    }

    .offer-content {
      position: relative;
      z-index: 2;
      padding-bottom: 70px;
    }

    .business-name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .offer-title {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .offer-description {
      font-size: 16px;
      line-height: 1.4;
      margin-bottom: 14px;
      color: #ddd;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 16px;
      color: #00c8ff;
    }

    .go-button {
      display: inline-block;
      background: #00c8ff;
      color: #000;
      padding: 14px 26px;
      border-radius: 999px;
      font-weight: bold;
      text-decoration: none;
      font-size: 18px;
    }

    .merchant-link {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      color: #fff;
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.25);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <!-- SPLASH -->
  <div id="splash">
    <div class="logo-text">OfferFind</div>
    <div class="pin"></div>
  </div>

  <!-- APP USUARIO -->
  <main id="app">

    <section class="offer-card">
      <div class="media-placeholder">Vídeo / Imagen</div>

      <div class="offer-content">
        <div class="business-name">Bar La Plaza</div>
        <div class="offer-title">Caña + tapa</div>
        <div class="offer-description">
          Oferta disponible hoy. Ven y disfruta de una caña con tapa en el centro.
        </div>
        <div class="price">2,50 €</div>
        <a class="go-button" href="https://www.google.com/maps/search/?api=1&query=Malaga" target="_blank">
          Ir
        </a>
      </div>
    </section>

    <section class="offer-card">
      <div class="media-placeholder">Vídeo / Imagen</div>

      <div class="offer-content">
        <div class="business-name">Cafetería Central</div>
        <div class="offer-title">Desayuno completo</div>
        <div class="offer-description">
          Café, tostada y zumo. Oferta especial para esta mañana.
        </div>
        <div class="price">3,90 €</div>
        <a class="go-button" href="https://www.google.com/maps/search/?api=1&query=Malaga" target="_blank">
          Ir
        </a>
      </div>
    </section>

  </main>

  <a href="#" class="merchant-link">Soy comercio</a>

  <script>
    setTimeout(() => {
      document.getElementById("splash").style.display = "none";
      document.getElementById("app").style.display = "block";
      document.body.style.overflow = "hidden";
    }, 1000);
  </script>

</body>
</html>
