<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Control de fichaje</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<h2>Control de fichaje</h2>

<label>Seleccionar trabajador:</label>
<br><br>

<select id="trabajador">
<option>Cargando trabajadores...</option>
</select>

<script>

const { createClient } = supabase

const supabaseClient = createClient(
"https://mmfuhvljxzvfotonj.supabase.co",
"sb_publishable_e8InYDhxDcj44ZmrAsuIg_zp1mJRAK"
)

async function cargarTrabajadores(){

const { data, error } = await supabaseClient
.from("trabajadores")
.select("*")

console.log("DATA:", data)
console.log("ERROR:", error)

if(error){
alert("Error cargando trabajadores")
console.log(error)
return
}

const select = document.getElementById("trabajador")

select.innerHTML = ""

data.forEach(trabajador => {

const option = document.createElement("option")
option.value = trabajador.id
option.textContent = trabajador.nombre

select.appendChild(option)

})

}

cargarTrabajadores()

</script>

</body>
</html>
