<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Control fichaje</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<h2>Control de fichaje</h2>

<select id="trabajador">
<option>Cargando trabajadores...</option>
</select>

<script>

const supabase = window.supabase.createClient(
"https://rldfnkqebxjtgypxwa.supabase.co",
"sb_publishable_e8lnYDhwxDcj44ZmrAsuIg_zplmJRAK"
)

async function cargarTrabajadores(){

const { data, error } = await supabase
.from("trabajadores")
.select("*")

if(error){
alert("Error cargando trabajadores")
console.log(error)
return
}

const select = document.getElementById("trabajador")
select.innerHTML = ""

data.forEach(t => {

let option = document.createElement("option")
option.value = t.id
option.textContent = t.nombre

select.appendChild(option)

})

}

cargarTrabajadores()

</script>

</body>
</html>
