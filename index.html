<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUXOIS Control de Obras</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:
    linear-gradient(rgba(0,0,0,0.18), rgba(0,0,0,0.48)),
    url("https://luxois.vercel.app/luxois-login.png") no-repeat center center;
  background-size:cover;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Cinzel', serif;
}

.loginBox{
  width:100%;
  max-width:430px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  text-align:center;
  padding:72px 24px 40px 24px;
}

.logo{
  margin:0;
  color:#f0b33a;
  font-size:68px;
  line-height:0.95;
  font-weight:700;
  letter-spacing:1px;
  text-shadow:
    0 0 6px rgba(240,179,58,0.25),
    0 0 16px rgba(240,179,58,0.10);
}

.logo .bigX{
  font-size:1.18em;
  display:inline-block;
  transform:translateY(2px);
}

.sublogo{
  margin:8px 0 110px 0;
  color:#f0b33a;
  font-size:21px;
  font-weight:600;
  letter-spacing:2px;
  text-shadow:
    0 0 6px rgba(240,179,58,0.18);
}

.pinTitle{
  margin:0 0 26px 0;
  color:#f0b33a;
  font-size:34px;
  font-weight:600;
  letter-spacing:6px;
  text-shadow:
    0 0 6px rgba(240,179,58,0.18);
}

.pinRow{
  display:flex;
  gap:22px;
  margin-bottom:22px;
}

.pinInput{
  width:52px;
  height:48px;
  border:none;
  border-bottom:3px solid #f0b33a;
  background:transparent;
  color:#f0b33a;
  font-size:34px;
  font-family:'Cinzel', serif;
  text-align:center;
  outline:none;
}

.pinInput::-webkit-outer-spin-button,
.pinInput::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0;
}

.pinDots{
  display:flex;
  gap:18px;
  margin-bottom:120px;
}

.pinDots span{
  width:14px;
  height:14px;
  border-radius:50%;
  background:#f0b33a;
  box-shadow:
    0 0 10px rgba(240,179,58,0.65),
    0 0 18px rgba(240,179,58,0.15);
}

.entrarBtn{
  min-width:230px;
  padding:15px 34px;
  font-size:22px;
  font-weight:700;
  letter-spacing:2px;
  font-family:'Cinzel', serif;
  color:#f0b33a;
  background:rgba(0,0,0,0.34);
  border:2px solid #f0b33a;
  cursor:pointer;
  box-shadow:
    0 0 12px rgba(240,179,58,0.18),
    inset 0 0 8px rgba(240,179,58,0.06);
}

.entrarBtn:hover{
  background:rgba(240,179,58,0.10);
}

.mensaje{
  margin-top:24px;
  color:#f0b33a;
  font-size:15px;
  min-height:24px;
  text-shadow:0 0 6px rgba(240,179,58,0.18);
}

@media (max-width:600px){
  .loginBox{
    max-width:100%;
    padding-top:76px;
  }

  .logo{
    font-size:64px;
  }

  .sublogo{
    font-size:20px;
    margin-bottom:104px;
  }

  .pinTitle{
    font-size:32px;
  }

  .pinRow{
    gap:18px;
  }

  .pinInput{
    width:48px;
    font-size:32px;
  }

  .pinDots{
    margin-bottom:112px;
  }

  .entrarBtn{
    min-width:220px;
    font-size:21px;
  }
}
</style>
</head>

<body>

<div class="loginBox">

  <h1 class="logo">LU<span class="bigX">X</span>OIS</h1>
  <h2 class="sublogo">CONTROL DE OBRAS</h2>

  <h3 class="pinTitle">PIN</h3>

  <div class="pinRow">
    <input class="pinInput" maxlength="1" inputmode="numeric">
    <input class="pinInput" maxlength="1" inputmode="numeric">
    <input class="pinInput" maxlength="1" inputmode="numeric">
    <input class="pinInput" maxlength="1" inputmode="numeric">
  </div>

  <div class="pinDots">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <button class="entrarBtn" onclick="entrar()">ENTRAR</button>

  <div class="mensaje" id="mensaje"></div>

</div>

<script>
const inputs = document.querySelectorAll(".pinInput");
const mensaje = document.getElementById("mensaje");

inputs.forEach((input, index) => {
  input.addEventListener("input", () => {
    input.value = input.value.replace(/[^0-9]/g, "");

    if(input.value && index < inputs.length - 1){
      inputs[index + 1].focus();
    }
  });

  input.addEventListener("keydown", (e) => {
    if(e.key === "Backspace" && !input.value && index > 0){
      inputs[index - 1].focus();
    }
  });
});

function entrar(){
  let pin = "";

  inputs.forEach(input => {
    pin += input.value;
  });

  if(pin.length !== 4){
    mensaje.textContent = "Introduce el PIN completo";
    return;
  }

  mensaje.textContent = "PIN introducido: " + pin;
}
</script>

</body>
</html>
