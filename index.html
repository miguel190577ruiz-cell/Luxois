<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUXOIS Control de Obras</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
background:black;
display:flex;
justify-content:center;
align-items:center;
font-family:'Cinzel', serif;
color:#f0b33a;
}

.pantalla{
width:100%;
max-width:420px;
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-start;
text-align:center;
padding:40px 24px;
}

.logo{
font-size:64px;
margin:0;
letter-spacing:2px;
}

.sublogo{
font-size:22px;
margin:0 0 50px 0;
letter-spacing:3px;
}

.estado{
font-size:30px;
margin:0 0 50px 0;
min-height:40px;
}

.tituloPanel{
font-size:28px;
margin:0 0 50px 0;
letter-spacing:4px;
}

.pinTitle{
font-size:28px;
margin-bottom:24px;
letter-spacing:6px;
}

.pinRow{
display:flex;
gap:20px;
margin-bottom:20px;
}

.pinInput{
width:50px;
height:50px;
border:none;
border-bottom:3px solid #f0b33a;
background:transparent;
color:#f0b33a;
font-size:32px;
text-align:center;
outline:none;
font-family:'Cinzel', serif;
}

.pinDots{
display:flex;
gap:18px;
margin-bottom:70px;
}

.pinDots span{
width:12px;
height:12px;
background:#f0b33a;
border-radius:50%;
box-shadow:0 0 8px #f0b33a;
}

.boton{
width:260px;
padding:14px 20px;
font-size:22px;
letter-spacing:2px;
background:black;
border:2px solid #f0b33a;
color:#f0b33a;
cursor:pointer;
font-family:'Cinzel', serif;
margin-bottom:20px;
}

.boton:hover{
background:#f0b33a;
color:black;
}

.mensaje{
margin-top:10px;
min-height:24px;
font-size:14px;
}

.oculto{
display:none !important;
}

/* MODAL LUXOIS */
.modalFondo{
position:fixed;
inset:0;
background:rgba(0,0,0,0.88);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
z-index:999;
}

.modalCaja{
width:100%;
max-width:380px;
border:2px solid #f0b33a;
padding:24px 20px;
background:black;
box-shadow:0 0 18px rgba(240,179,58,0.18);
text-align:center;
}

.modalTitulo{
font-size:26px;
margin:0 0 24px 0;
letter-spacing:3px;
}

.listaObras{
display:flex;
flex-direction:column;
gap:14px;
margin-bottom:24px;
}

.botonObra{
width:100%;
padding:12px 16px;
font-size:20px;
letter-spacing:1px;
background:black;
border:2px solid #f0b33a;
color:#f0b33a;
cursor:pointer;
font-family:'Cinzel', serif;
}

.botonObra:hover{
background:#f0b33a;
color:black;
}

.botonCerrar{
width:100%;
padding:12px 16px;
font-size:18px;
background:black;
border:2px solid #f0b33a;
color:#f0b33a;
cursor:pointer;
font-family:'Cinzel', serif;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="pantallaLogin" class="pantalla">
<h1 class="logo">LUXOIS</h1>
<h2 class="sublogo">CONTROL DE OBRAS</h2>

<h3 class="pinTitle">PIN</h3>

<div class="pinRow">
<input class="pinInput" maxlength="1" inputmode="numeric">
<input class="pinInput" maxlength="1" inputmode="numeric">
<input class="pinInput" maxlength="1" inputmode="numeric">
<input class="pinInput" maxlength="1" inputmode="numeric">
</div>

<div class="pinDots">
<span></span>
<span></span>
<span></span>
<span></span>
</div>

<button class="boton" id="btnEntrarApp">ENTRAR</button>
<div class="mensaje" id="mensajeLogin"></div>
</div>

<!-- TRABAJADOR -->
<div id="pantallaTrabajador" class="pantalla oculto">
<h1 class="logo">LUXOIS</h1>
<h2 class="sublogo">CONTROL DE OBRAS</h2>

<h3 class="estado" id="estadoTrabajador">HOLA</h3>

<button class="boton" id="btnEntrada">ENTRAR</button>
<button class="boton" id="btnSalida">SALIR</button>
<button class="boton" id="btnSemana">HORAS SEMANA</button>
<button class="boton" id="btnMes">HORAS MES</button>
</div>

<!-- ENCARGADO -->
<div id="pantallaEncargado" class="pantalla oculto">
<h1 class="logo">LUXOIS</h1>
<h2 class="sublogo">CONTROL DE OBRAS</h2>

<h3 class="tituloPanel">PANEL ENCARGADO</h3>

<button class="boton" id="btnObra">OBRA</button>
<button class="boton" id="btnAñadirObra">AÑADIR OBRA</button>
<button class="boton" id="btnAñadirTrabajador">AÑADIR TRABAJADOR</button>
<button class="boton" id="btnTrabajando">TRABAJANDO</button>
<button class="boton" id="btnHorasSemanaEnc">HORAS SEMANA</button>
<button class="boton" id="btnHorasMesEnc">HORAS MES</button>
</div>

<!-- MODAL OBRAS -->
<div id="modalObras" class="modalFondo oculto">
<div class="modalCaja">
<h3 class="modalTitulo">SELECCIONAR OBRA</h3>
<div id="listaObras" class="listaObras"></div>
<button class="botonCerrar" id="btnCerrarModalObras">CERRAR</button>
</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

const { createClient } = supabase;

const supabaseClient = createClient(
"https://rldffnkqebxigtygpxwa.supabase.co",
"sb_publishable_e8lnYDhwxDcj44ZmrAsuIg_zplmJRAK"
);

const PIN_ENCARGADO = "7126";

const inputs = document.querySelectorAll(".pinInput");
const mensajeLogin = document.getElementById("mensajeLogin");

const pantallaLogin = document.getElementById("pantallaLogin");
const pantallaTrabajador = document.getElementById("pantallaTrabajador");
const pantallaEncargado = document.getElementById("pantallaEncargado");

const estadoTrabajador = document.getElementById("estadoTrabajador");
const btnSemana = document.getElementById("btnSemana");
const btnMes = document.getElementById("btnMes");
const btnEntrarApp = document.getElementById("btnEntrarApp");
const btnEntrada = document.getElementById("btnEntrada");
const btnSalida = document.getElementById("btnSalida");

const btnObra = document.getElementById("btnObra");
const btnAñadirObra = document.getElementById("btnAñadirObra");
const btnAñadirTrabajador = document.getElementById("btnAñadirTrabajador");
const btnTrabajando = document.getElementById("btnTrabajando");
const btnHorasSemanaEnc = document.getElementById("btnHorasSemanaEnc");
const btnHorasMesEnc = document.getElementById("btnHorasMesEnc");

const modalObras = document.getElementById("modalObras");
const listaObrasDiv = document.getElementById("listaObras");
const btnCerrarModalObras = document.getElementById("btnCerrarModalObras");

let nombreTrabajadorActual = "";
let obraSeleccionada = "";
let listaObras = [];

const HORAS_SEMANA_PRUEBA = 32;
const HORAS_MES_PRUEBA = 118;

function hoyString(){
return new Date().toISOString().split("T")[0];
}

function leerEstadoDia(){
const guardado = localStorage.getItem("estado_trabajador");
const fecha = localStorage.getItem("estado_fecha");

if(fecha !== hoyString()){
localStorage.setItem("estado_fecha", hoyString());
localStorage.setItem("estado_trabajador", "inicio");
return "inicio";
}

return guardado || "inicio";
}

function guardarEstadoDia(estado){
localStorage.setItem("estado_fecha", hoyString());
localStorage.setItem("estado_trabajador", estado);
}

function actualizarPantallaTrabajador(){
const estado = leerEstadoDia();

if(estado === "inicio"){
estadoTrabajador.textContent = "HOLA, " + nombreTrabajadorActual.toUpperCase();
}
else if(estado === "trabajando"){
estadoTrabajador.textContent = "TRABAJANDO";
}
else if(estado === "salido"){
estadoTrabajador.textContent = "HAS HECHO 9 HORAS";
}
}

async function cargarObras(){

const { data, error } = await supabaseClient
.from("obras")
.select("*")
.order("nombre", { ascending: true });

if(error){
console.log(error);
listaObras = [];
btnObra.textContent = "OBRA";
return;
}

listaObras = data || [];

if(listaObras.length > 0){
if(!obraSeleccionada){
obraSeleccionada = listaObras[0].nombre;
}
btnObra.textContent = obraSeleccionada;
}else{
obraSeleccionada = "";
btnObra.textContent = "SIN OBRA";
}

}

function abrirModalObras(){
if(listaObras.length === 0){
alert("No hay obras creadas");
return;
}

listaObrasDiv.innerHTML = "";

listaObras.forEach(obra => {
const boton = document.createElement("button");
boton.className = "botonObra";
boton.textContent = obra.nombre;

boton.addEventListener("click", () => {
obraSeleccionada = obra.nombre;
btnObra.textContent = obraSeleccionada;
cerrarModalObras();
});

listaObrasDiv.appendChild(boton);
});

modalObras.classList.remove("oculto");
}

function cerrarModalObras(){
modalObras.classList.add("oculto");
}

inputs.forEach((input, index) => {

input.addEventListener("input", () => {
input.value = input.value.replace(/[^0-9]/g, "");

if(input.value && index < inputs.length - 1){
inputs[index + 1].focus();
}
});

input.addEventListener("keydown", (e) => {
if(e.key === "Backspace" && !input.value && index > 0){
inputs[index - 1].focus();
}
});

});

async function entrarApp(){

let pin = "";

inputs.forEach(input => {
pin += input.value;
});

if(pin.length !== 4){
mensajeLogin.textContent = "Introduce el PIN completo";
return;
}

if(pin === PIN_ENCARGADO){
mensajeLogin.textContent = "";
pantallaLogin.classList.add("oculto");
pantallaEncargado.classList.remove("oculto");
await cargarObras();
return;
}

const { data, error } = await supabaseClient
.from("trabajadores")
.select("*")
.eq("pin", pin)
.maybeSingle();

if(error){
console.log(error);
mensajeLogin.textContent = "Error conectando";
return;
}

if(!data){
mensajeLogin.textContent = "PIN incorrecto";
return;
}

nombreTrabajadorActual = data.nombre || "TRABAJADOR";

mensajeLogin.textContent = "";
pantallaLogin.classList.add("oculto");
pantallaTrabajador.classList.remove("oculto");

actualizarPantallaTrabajador();
}

function ficharEntrada(){
guardarEstadoDia("trabajando");
actualizarPantallaTrabajador();
}

function ficharSalida(){
guardarEstadoDia("salido");
actualizarPantallaTrabajador();
}

function verHorasSemana(){
btnSemana.textContent = "SEMANA: " + HORAS_SEMANA_PRUEBA + " H";

setTimeout(() => {
btnSemana.textContent = "HORAS SEMANA";
}, 5000);
}

function verHorasMes(){
btnMes.textContent = "MES: " + HORAS_MES_PRUEBA + " H";

setTimeout(() => {
btnMes.textContent = "HORAS MES";
}, 5000);
}

async function añadirObra(){

const nombreObra = prompt("Escribe el nombre de la nueva obra");

if(!nombreObra) return;

const { error } = await supabaseClient
.from("obras")
.insert([
{ nombre: nombreObra }
]);

if(error){
console.log(error);
alert("Error al crear la obra");
return;
}

alert("Obra creada correctamente");
await cargarObras();
}

async function añadirTrabajador(){

if(!obraSeleccionada){
alert("Selecciona primero una obra");
return;
}

const nombre = prompt("Nombre del trabajador");
if(!nombre) return;

const pin = prompt("PIN del trabajador (4 números)");
if(!pin) return;

const precioHora = prompt("Precio por hora");
if(!precioHora) return;

const telefono = prompt("Teléfono");
if(!telefono) return;

const { error } = await supabaseClient
.from("trabajadores")
.insert([
{
nombre: nombre,
pin: pin,
obra: obraSeleccionada,
precio_hora: precioHora,
telefono: telefono,
movil_id: null
}
]);

if(error){
console.log(error);
alert("Error al crear trabajador");
return;
}

alert("Trabajador creado correctamente en la obra " + obraSeleccionada);

}

function funcionNoDisponible(){
alert("Esta función la añadiremos en el siguiente paso");
}

btnEntrarApp.addEventListener("click", entrarApp);
btnEntrada.addEventListener("click", ficharEntrada);
btnSalida.addEventListener("click", ficharSalida);
btnSemana.addEventListener("click", verHorasSemana);
btnMes.addEventListener("click", verHorasMes);

btnObra.addEventListener("click", abrirModalObras);
btnAñadirObra.addEventListener("click", añadirObra);
btnAñadirTrabajador.addEventListener("click", añadirTrabajador);

btnTrabajando.addEventListener("click", funcionNoDisponible);
btnHorasSemanaEnc.addEventListener("click", funcionNoDisponible);
btnHorasMesEnc.addEventListener("click", funcionNoDisponible);

btnCerrarModalObras.addEventListener("click", cerrarModalObras);

});
</script>

</body>
</html>
