<!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8">
<title>Luxois Control de Obras</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script><style>
body{
font-family:Arial;
text-align:center;
margin-top:60px;
}

select,input,button{
font-size:18px;
padding:10px;
margin:8px;
width:250px;
}

.entrar{
background:#2ecc71;
color:white;
border:none;
}

.salir{
background:#e74c3c;
color:white;
border:none;
}

#estado{
margin-top:20px;
font-size:20px;
font-weight:bold;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>
<body><h1>Luxois Control de Obras</h1>
<option value="">Seleccionar trabajador</option>
</select>

<input type="password" id="pin" placeholder="PIN"><select id="obra">
<option value="Castillo de Monterrey">Castillo de Monterrey</option>
</select><br><button class="entrar" onclick="fichar('entrada')">ENTRAR</button>
<button class="salir" onclick="fichar('salida')">SALIR</button>

<div id="estado"></div><script>

const supabase = window.supabase.createClient(
"https://rldfnkqebxjtgypxwa.supabase.co",
"sb_publishable_e8lnYDhwxDcj44ZmrAsuIg_zplmJRAK"
)

async function cargarTrabajadores(){

const { data, error } = await supabase
.from("trabajadores")
.select("id,nombre")

if(error){
alert("Error cargando trabajadores")
console.log(error)
return
}

const select = document.getElementById("trabajador")

select.innerHTML=""

data.forEach(t => {

let op = document.createElement("option")

op.value = t.id
op.textContent = t.nombre

select.appendChild(op)

})

}

async function fichar(tipo){

const trabajadorId = document.getElementById("trabajador").value
const pin = document.getElementById("pin").value
const obra = document.getElementById("obra").value

const { data: trabajador } = await supabase
.from("trabajadores")
.select("id,nombre,pin")
.eq("id", trabajadorId)
.single()

if(!trabajador){
alert("Trabajador no encontrado")
return
}

if(pin != trabajador.pin){
alert("PIN incorrecto")
return
}

await supabase
.from("fichajes")
.insert({
trabajador_id: trabajadorId,
tipo: tipo,
obra: obra,
hora: new Date()
})

document.getElementById("estado").innerText =
tipo == "entrada" ? "🟢 Trabajando" : "🔴 No trabajando"

document.getElementById("pin").value=""

}

cargarTrabajadores()

  </script>
</body>
</html>
