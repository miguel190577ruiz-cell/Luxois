function construirISOHoyDesdeHora(horaTexto){
  const partes = horaTexto.split(":");
  if(partes.length !== 2) return null;

  const horas = parseInt(partes[0], 10);
  const minutos = parseInt(partes[1], 10);

  if(
    isNaN(horas) || isNaN(minutos) ||
    horas < 0 || horas > 23 ||
    minutos < 0 || minutos > 59
  ){
    return null;
  }

  const ahora = new Date();
  ahora.setHours(horas, minutos, 0, 0);
  return ahora.toISOString();
}

function calcularHorasRedondeadasDesdeFichaje(fichaje){
  if(!fichaje) return 0;
  if(fichaje.horas_redondeadas != null) return Number(fichaje.horas_redondeadas);
  if(!fichaje.entrada || !fichaje.salida) return 0;

  const entrada = new Date(fichaje.entrada);
  const salida = new Date(fichaje.salida);
  let horas = (salida - entrada) / 1000 / 60 / 60;

  const minutosSalida = salida.getHours() * 60 + salida.getMinutes();
  const limiteComida = 14 * 60 + 25;

  if(minutosSalida > limiteComida){
    horas = horas - 1;
  }

  if(horas < 0) horas = 0;
  return Math.round(horas);
}

function construirHorasPorFecha(fichajes){
  const mapa = {};

  (fichajes || []).forEach(fichaje => {
    const fecha = fichaje.fecha;
    if(!fecha) return;

    const valor = calcularHorasRedondeadasDesdeFichaje(fichaje);
    const tieneCorreccion = fichaje.horas_redondeadas != null;

    if(!mapa[fecha]){
      mapa[fecha] = { horas: valor, corregido: tieneCorreccion };
      return;
    }

    if(tieneCorreccion){
      mapa[fecha] = { horas: valor, corregido: true };
      return;
    }

    if(!mapa[fecha].corregido){
      mapa[fecha].horas = valor;
    }
  });

  const salida = {};
  Object.keys(mapa).forEach(fecha => {
    salida[fecha] = mapa[fecha].horas;
  });
  return salida;
}

function agruparHorasPorTrabajadorYFecha(fichajes){
  const mapa = {};

  (fichajes || []).forEach(fichaje => {
    const trabajador = fichaje.trabajador || "SIN NOMBRE";
    const fecha = fichaje.fecha;
    if(!fecha) return;

    const valor = calcularHorasRedondeadasDesdeFichaje(fichaje);
    const clave = trabajador + "||" + fecha;
    const tieneCorreccion = fichaje.horas_redondeadas != null;

    if(!mapa[clave]){
      mapa[clave] = { trabajador, fecha, horas: valor, corregido: tieneCorreccion };
      return;
    }

    if(tieneCorreccion){
      mapa[clave].horas = valor;
      mapa[clave].corregido = true;
      return;
    }

    if(!mapa[clave].corregido){
      mapa[clave].horas = valor;
    }
  });

  return Object.values(mapa);
}

function obtenerInicioSemana(fecha){
  const d = new Date(fecha);
  const dia = d.getDay();
  const ajuste = dia === 0 ? -6 : 1 - dia;
  d.setDate(d.getDate() + ajuste);
  d.setHours(0,0,0,0);
  return d;
}

function formatearFechaYYYYMMDD(fecha){
  const año = fecha.getFullYear();
  const mes = String(fecha.getMonth() + 1).padStart(2, "0");
  const dia = String(fecha.getDate()).padStart(2, "0");
  return `${año}-${mes}-${dia}`;
}

async function comprobarUbicacionDentroDeObra(obra){
  if(!obra) throw new Error("No se encontró la obra");
  if(obra.latitud == null || obra.longitud == null || obra.radio_fichaje == null){
    throw new Error("La obra no tiene ubicación o radio configurado");
  }
  if(!navigator.geolocation){
    throw new Error("Tu dispositivo no permite geolocalización");
  }

  const posicion = await new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(
      p => resolve(p),
      e => reject(e),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  });

  const distancia = calcularDistanciaMetros(
    posicion.coords.latitude,
    posicion.coords.longitude,
    parseFloat(obra.latitud),
    parseFloat(obra.longitud)
  );

  const radioPermitido = parseFloat(obra.radio_fichaje);
  if(distancia > radioPermitido){
    throw new Error("Fuera del radio permitido de la obra");
  }
}

function calcularDistanciaMetros(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = grados => grados * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);

  const a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
    Math.sin(dLon / 2) * Math.sin(dLon / 2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}

async function cargarObras(){
  const { data, error } = await supabaseClient
    .from("obras")
    .select("*")
    .order("nombre", { ascending: true });

  if(error){
    console.log(error);
    listaObras = [];
    obraSeleccionada = "";
    obraSeleccionadaId = null;
    btnObra.textContent = "OBRA";
    return;
  }

  listaObras = data || [];

  if(listaObras.length > 0){
    if(!obraSeleccionadaId){
      obraSeleccionadaId = listaObras[0].id;
      obraSeleccionada = listaObras[0].nombre;
    } else {
      const obraActual = listaObras.find(o => o.id === obraSeleccionadaId);
      if(obraActual){
        obraSeleccionada = obraActual.nombre;
      } else {
        obraSeleccionadaId = listaObras[0].id;
        obraSeleccionada = listaObras[0].nombre;
      }
    }
    btnObra.textContent = obraSeleccionada;
  } else {
    obraSeleccionada = "";
    obraSeleccionadaId = null;
    btnObra.textContent = "SIN OBRA";
  }
}

async function cargarEstadoTrabajadorActual(){
  if(!trabajadorActual) return;

  const fecha = hoyString();

  const { data, error } = await supabaseClient
    .from("fichajes")
    .select("*")
    .eq("trabajador", trabajadorActual.nombre)
    .eq("obra", trabajadorActual.obra)
    .eq("fecha", fecha)
    .order("entrada", { ascending: false });

  if(error){
    console.log(error);
    estadoTrabajador.textContent = "HOLA, " + nombreTrabajadorActual.toUpperCase();
    return;
  }

  const fichajes = data || [];
  const abierto = fichajes.find(f => f.entrada && !f.salida);
  const cerrado = fichajes.find(f => f.entrada && f.salida);

  if(abierto){
    estadoTrabajador.textContent = "TRABAJANDO";
    return;
  }

  if(cerrado){
    const horas = calcularHorasRedondeadasDesdeFichaje(cerrado);
    estadoTrabajador.textContent = "HAS HECHO " + horas + " HORAS";
    return;
  }

  estadoTrabajador.textContent = "HOLA, " + nombreTrabajadorActual.toUpperCase();
}

async function guardarCorreccionHoras(fecha, horasRedondeadas){
  if(!trabajadorSeleccionadoFicha) throw new Error("No hay trabajador seleccionado");

  const { data: existentes, error: errorBuscar } = await supabaseClient
    .from("fichajes")
    .select("id")
    .eq("trabajador", trabajadorSeleccionadoFicha.nombre)
    .eq("obra", trabajadorSeleccionadoFicha.obra)
    .eq("fecha", fecha);

  if(errorBuscar) throw errorBuscar;

  if(existentes && existentes.length > 0){
    const { error: errorUpdate } = await supabaseClient
      .from("fichajes")
      .update({
        horas_redondeadas: horasRedondeadas,
        horas: horasRedondeadas
      })
      .eq("trabajador", trabajadorSeleccionadoFicha.nombre)
      .eq("obra", trabajadorSeleccionadoFicha.obra)
      .eq("fecha", fecha);

    if(errorUpdate) throw errorUpdate;
  } else {
    const { error: errorInsert } = await supabaseClient
      .from("fichajes")
      .insert([{
        trabajador: trabajadorSeleccionadoFicha.nombre,
        obra: trabajadorSeleccionadoFicha.obra,
        fecha: fecha,
        horas: horasRedondeadas,
        horas_redondeadas: horasRedondeadas
      }]);

    if(errorInsert) throw errorInsert;
  }
}

async function abrirHorasSemanaTrabajador(){
  if(!trabajadorSeleccionadoFicha) return;

  const hoy = new Date();
  const inicioSemana = obtenerInicioSemana(hoy);
  const finSemana = new Date(inicioSemana);
  finSemana.setDate(finSemana.getDate() + 6);

  const fechaInicio = formatearFechaYYYYMMDD(inicioSemana);
  const fechaFin = formatearFechaYYYYMMDD(finSemana);

  const { data, error } = await supabaseClient
    .from("fichajes")
    .select("*")
    .eq("trabajador", trabajadorSeleccionadoFicha.nombre)
    .eq("obra", trabajadorSeleccionadoFicha.obra)
    .gte("fecha", fechaInicio)
    .lte("fecha", fechaFin)
    .order("fecha", { ascending: true });

  if(error){
    console.log(error);
    alert("Error cargando horas de la semana");
    return;
  }

  const horasPorDia = construirHorasPorFecha(data || []);
  const datosSemana = [];

  for(let i = 0; i < 7; i++){
    const fechaDia = new Date(inicioSemana);
    fechaDia.setDate(fechaDia.getDate() + i);
    const clave = formatearFechaYYYYMMDD(fechaDia);

    datosSemana.push({
      indice: i,
      nombreDia: nombreDiaSemana(i),
      fecha: clave,
      horas: horasPorDia[clave] || 0
    });
  }

  tituloHorasSemana.textContent = "SEMANA DE " + trabajadorSeleccionadoFicha.nombre.toUpperCase();
  renderHorasSemana(datosSemana);
  modalHorasSemana.classList.remove("oculto");
}

async function cargarYRenderizarMes(){
  if(!trabajadorSeleccionadoFicha) return;

  const primerDia = new Date(añoVisualizado, mesVisualizado, 1);
  const ultimoDia = new Date(añoVisualizado, mesVisualizado + 1, 0);

  const fechaInicio = formatearFechaYYYYMMDD(primerDia);
  const fechaFin = formatearFechaYYYYMMDD(ultimoDia);

  const { data, error } = await supabaseClient
    .from("fichajes")
    .select("*")
    .eq("trabajador", trabajadorSeleccionadoFicha.nombre)
    .eq("obra", trabajadorSeleccionadoFicha.obra)
    .gte("fecha", fechaInicio)
    .lte("fecha", fechaFin)
    .order("fecha", { ascending: true });

  if(error){
    console.log(error);
    alert("Error cargando horas del mes");
    return;
  }

  const horasPorDia = construirHorasPorFecha(data || []);
  const totalDias = diasEnMes(añoVisualizado, mesVisualizado);
  datosMesActual = [];

  for(let dia = 1; dia <= totalDias; dia++){
    const fecha = new Date(añoVisualizado, mesVisualizado, dia);
    const clave = formatearFechaYYYYMMDD(fecha);

    datosMesActual.push({
      dia: dia,
      fecha: clave,
      horas: horasPorDia[clave] || 0
    });
  }

  renderHorasMes();
}

async function abrirHorasSemanaObra(){
  if(!obraSeleccionada){
    alert("Selecciona primero una obra");
    return;
  }

  const hoy = new Date();
  const inicioSemana = obtenerInicioSemana(hoy);
  const finSemana = new Date(inicioSemana);
  finSemana.setDate(finSemana.getDate() + 6);

  const fechaInicio = formatearFechaYYYYMMDD(inicioSemana);
  const fechaFin = formatearFechaYYYYMMDD(finSemana);

  const { data: fichajes, error } = await supabaseClient
    .from("fichajes")
    .select("*")
    .eq("obra", obraSeleccionada)
    .gte("fecha", fechaInicio)
    .lte("fecha", fechaFin)

    .order("fecha", { ascending: true });

async function modificarHorasSemana(){
  if(!trabajadorSeleccionadoFicha || datosSemanaActual.length === 0) return;

  const diaTextoOriginal = prompt(
    "Escribe el día a modificar.\n\nEjemplo:\nMIERCOLES\n\nDías válidos:\nLUNES, MARTES, MIERCOLES, JUEVES, VIERNES, SABADO, DOMINGO"
  );
  if(!diaTextoOriginal) return;

  const diaTexto = diaTextoOriginal.trim().toUpperCase()
    .replace("MIÉRCOLES", "MIERCOLES")
    .replace("SÁBADO", "SABADO");

  const mapaDias = {
    "LUNES": "LUNES",
    "MARTES": "MARTES",
    "MIERCOLES": "MIÉRCOLES",
    "JUEVES": "JUEVES",
    "VIERNES": "VIERNES",
    "SABADO": "SÁBADO",
    "DOMINGO": "DOMINGO"
  };

  if(!mapaDias[diaTexto]){
    alert("Día no válido");
    return;
  }

  const horasTexto = prompt("Escribe las horas nuevas para " + mapaDias[diaTexto]);
  if(horasTexto === null || horasTexto === "") return;

  const nuevasHoras = parseFloat(horasTexto);
  if(isNaN(nuevasHoras) || nuevasHoras < 0){
    alert("Horas no válidas");
    return;
  }

  const nombreNormalizado = mapaDias[diaTexto];
  const dia = datosSemanaActual.find(d => d.nombreDia === nombreNormalizado);
  if(!dia){
    alert("No se encontró ese día en la semana");
    return;
  }

  const horasFinales = Math.round(nuevasHoras);

  try{
    await guardarCorreccionHoras(dia.fecha, horasFinales);
    dia.horas = horasFinales;
    renderHorasSemana(datosSemanaActual);
    alert("Horas guardadas correctamente");
  }catch(error){
    console.log(error);
    alert("Error al guardar las horas");
  }
}

async function modificarHorasMes(){
  if(!trabajadorSeleccionadoFicha || datosMesActual.length === 0) return;

  const diaTexto = prompt("Escribe el día del mes a modificar.\n\nEjemplo:\n19");
  if(!diaTexto) return;

  const diaNumero = parseInt(diaTexto, 10);
  if(isNaN(diaNumero) || diaNumero < 1 || diaNumero > datosMesActual.length){
    alert("Día no válido");
    return;
  }

  const horasTexto = prompt("Escribe las horas nuevas para el día " + diaNumero);
  if(horasTexto === null || horasTexto === "") return;

  const nuevasHoras = parseFloat(horasTexto);
  if(isNaN(nuevasHoras) || nuevasHoras < 0){
    alert("Horas no válidas");
    return;
  }

  const dia = datosMesActual.find(d => d.dia === diaNumero);
  if(!dia){
    alert("No se encontró ese día");
    return;
  }

  const horasFinales = Math.round(nuevasHoras);

  try{
    await guardarCorreccionHoras(dia.fecha, horasFinales);
    dia.horas = horasFinales;
    renderHorasMes();
    alert("Horas guardadas correctamente");
  }catch(error){
    console.log(error);
    alert("Error al guardar las horas");
  }
}

async function imprimirResumenObraAntesDeBorrar(){

    alert("No hay obra seleccionada");
    return;
  }

  const { data: fichajes, error } = await supabaseClient
    .from("fichajes")
    .select("*")
    .eq("obra", obraSeleccionada)
    .order("trabajador", { ascending: true })
    .order("fecha", { ascending: true });

  if(error){
    console.log(error);
    alert("Error al cargar el resumen de la obra");
    return;
  }

  const agrupados = agruparHorasPorTrabajadorYFecha(fichajes || []);
  const totalesPorTrabajador = {};

  agrupados.forEach(item => {
    if(!totalesPorTrabajador[item.trabajador]) totalesPorTrabajador[item.trabajador] = 0;
    totalesPorTrabajador[item.trabajador] += item.horas;
  });

  let filas = "";
  let totalGeneral = 0;
  Object.keys(totalesPorTrabajador).sort((a,b) => a.localeCompare(b)).forEach(nombre => {
    const horas = totalesPorTrabajador[nombre];
    totalGeneral += horas;
    filas += `<tr><td>${nombre}</td><td>${horas} H</td></tr>`;

  if(!filas){

  `);
}

async function actualizarAnticipoTrabajador(){
  if(!trabajadorSeleccionadoFicha) return;

  const hoy = new Date();
  const mes = hoy.getMonth() + 1;
  const anio = hoy.getFullYear();

  const registroActual = await obtenerAnticipoMensual(
    trabajadorSeleccionadoFicha.nombre,
    trabajadorSeleccionadoFicha.obra,
    mes,
    anio
  );

  const actual = Number((registroActual && registroActual.importe) || 0);

  const nuevoTexto = prompt(
    "Anticipo actual de " + nombreMes(mes - 1) + " " + anio + ": " + actual + "\n\nIntroduce nuevo anticipo",
    actual
  );

  if(nuevoTexto === null || nuevoTexto === "") return;

  const nuevo = parseFloat(nuevoTexto);
  if(isNaN(nuevo) || nuevo < 0){
    alert("Valor no válido");
    return;
  }

  if(registroActual){
    const { error } = await supabaseClient
      .from("anticipos")
      .update({ importe: nuevo })
      .eq("id", registroActual.id);

    if(error){
      console.log(error);
      alert("Error al guardar el anticipo");
      return;
    }
  } else {
    const { error } = await supabaseClient
      .from("anticipos")
      .insert([{
        trabajador: trabajadorSeleccionadoFicha.nombre,
        obra: trabajadorSeleccionadoFicha.obra,
        mes: mes,
        anio: anio,
        importe: nuevo
      }]);

    if(error){
      console.log(error);
      alert("Error al guardar el anticipo");
      return;
    }
  }

  alert("Anticipo guardado correctamente para " + nombreMes(mes - 1) + " " + anio);
}

async function ficharEntradaManualEncargado(){
  if(!trabajadorSeleccionadoFicha) return;

  const horaTexto = prompt("Escribe la hora de entrada manual.\n\nFormato: 08:00");
  if(!horaTexto) return;

  const entradaISO = construirISOHoyDesdeHora(horaTexto.trim());
  if(!entradaISO){
    alert("Hora no válida");
    return;
  }

  const fecha = hoyString();

  const { data: fichajesHoy, error: errorBuscar } = await supabaseClient
    .from("fichajes")
    .select("*")
    .eq("trabajador", trabajadorSeleccionadoFicha.nombre)
    .eq("obra", trabajadorSeleccionadoFicha.obra)
    .eq("fecha", fecha)
    .order("entrada", { ascending: false });

  if(errorBuscar){
    console.log(errorBuscar);
    alert("Error comprobando fichajes de hoy");
    return;
  }

  const abierto = (fichajesHoy || []).find(f => f.entrada && !f.salida);
  const cerrado = (fichajesHoy || []).find(f => f.entrada && f.salida);

  if(abierto){
    alert("Ese trabajador ya tiene una entrada abierta hoy");
    return;
  }

  if(cerrado){
    alert("Ese trabajador ya tiene un fichaje completo hoy");
    return;
  }

  const { error: errorInsert } = await supabaseClient
    .from("fichajes")
    .insert([{
      trabajador: trabajadorSeleccionadoFicha.nombre,
      obra: trabajadorSeleccionadoFicha.obra,
      fecha: fecha,
      entrada: entradaISO
    }]);

  if(errorInsert){
    console.log(errorInsert);
    alert("Error guardando la entrada manual");
    return;
  }

  alert("Entrada manual guardada correctamente");
  cerrarFichaTrabajador();
  await abrirModalTrabajando();
}

async function ficharSalidaManualEncargado(){
  if(!trabajadorSeleccionadoFicha) return;

  const horaTexto = prompt("Escribe la hora de salida manual.\n\nFormato: 17:30");
  if(!horaTexto) return;

  const salidaISO = construirISOHoyDesdeHora(horaTexto.trim());
  if(!salidaISO){
    alert("Hora no válida");
    return;
  }

  const fecha = hoyString();

  const { data: fichajesHoy, error: errorBuscar } = await supabaseClient
    .from("fichajes")
    .select("*")
    .eq("trabajador", trabajadorSeleccionadoFicha.nombre)
    .eq("obra", trabajadorSeleccionadoFicha.obra)
    .eq("fecha", fecha)
    .order("entrada", { ascending: false });

  if(errorBuscar){
    console.log(errorBuscar);
    alert("Error comprobando fichajes de hoy");
    return;
  }

  const abierto = (fichajesHoy || []).find(f => f.entrada && !f.salida);

  if(!abierto){
    alert("Ese trabajador no tiene una entrada abierta hoy");
    return;
  }

  const entradaFecha = new Date(abierto.entrada);
  const salidaFecha = new Date(salidaISO);

  if(salidaFecha <= entradaFecha){
    alert("La salida debe ser posterior a la entrada");
    return;
  }

  const fichajeCalculado = { ...abierto, salida: salidaISO };
  const horasRedondeadas = calcularHorasRedondeadasDesdeFichaje(fichajeCalculado);

  const { error: errorUpdate } = await supabaseClient
    .from("fichajes")
    .update({
      salida: salidaISO,
      horas: horasRedondeadas,
      horas_redondeadas: horasRedondeadas
    })
    .eq("id", abierto.id);

  if(errorUpdate){
    console.log(errorUpdate);
    alert("Error guardando la salida manual");
    return;
  }

  alert("Salida manual guardada correctamente");
  cerrarFichaTrabajador();
  await abrirModalTrabajando();
}

async function borrarObra(){
  if(!obraSeleccionada || !obraSeleccionadaId){
    alert("No hay obra seleccionada");
    return;
  }

  const opcion = prompt(
    "Vas a borrar la obra " + obraSeleccionada + ".\n\n" +
    "1 = IMPRIMIR ANTES\n" +
    "2 = BORRAR OBRA\n" +
    "3 = CANCELAR"
  );

  if(!opcion || opcion === "3") return;

  if(opcion === "1"){
    await imprimirResumenObraAntesDeBorrar();
    return;
  }

  if(opcion !== "2") return;

  const { data: trabajadoresActivos, error: errorTrabajadores } = await supabaseClient
    .from("trabajadores")
    .select("id")
    .eq("obra", obraSeleccionada)
    .eq("activo", true);

  if(errorTrabajadores){
    console.log(errorTrabajadores);
    alert("Error comprobando trabajadores de la obra");
    return;
  }

  if(trabajadoresActivos && trabajadoresActivos.length > 0){
    alert("No se puede borrar la obra porque tiene trabajadores activos asignados");
    return;
  }

  const confirmar = confirm(
    "¿Confirmas borrar la obra " + obraSeleccionada + "?\n\n" +
    "Los fichajes históricos seguirán existiendo, pero la obra desaparecerá del panel."
  );

  if(!confirmar) return;

  const { error } = await supabaseClient
    .from("obras")
    .delete()
    .eq("id", obraSeleccionadaId);

  if(error){
    console.log(error);
    alert("Error al borrar la obra");
    return;
  }

  alert("Obra borrada correctamente");
  obraSeleccionada = "";
  obraSeleccionadaId = null;
  await cargarObras();
}

async function abrirModalTrabajando(){
  if(!obraSeleccionada){
    alert("Selecciona primero una obra");
    return;
  }

  listaTrabajandoDiv.innerHTML = "";
  const hoy = hoyString();

  const { data: trabajadores, error: errorTrabajadores } = await supabaseClient
    .from("trabajadores")
    .select("*")
    .eq("obra", obraSeleccionada)
    .eq("activo", true)
    .order("nombre", { ascending: true });

  if(errorTrabajadores){
    console.log(errorTrabajadores);
    alert("Error cargando trabajadores");
    return;
  }

  const { data: fichajesHoy, error: errorFichajes } = await supabaseClient
    .from("fichajes")
    .select("*")
    .eq("obra", obraSeleccionada)
    .eq("fecha", hoy);

  if(errorFichajes){
    console.log(errorFichajes);
    alert("Error cargando fichajes");
    return;
  }

  if(!trabajadores || trabajadores.length === 0){
    listaTrabajandoDiv.innerHTML = "<div>No hay trabajadores en esta obra</div>";
    modalTrabajando.classList.remove("oculto");
    return;
  }

  trabajadores.forEach(trabajador => {
    const fichajesTrabajador = (fichajesHoy || []).filter(f => f.trabajador === trabajador.nombre);
    let estado = "NO FICHO ENTRADA";

    const fichajeAbierto = fichajesTrabajador.find(f => f.entrada && !f.salida);
    const fichajeCerrado = fichajesTrabajador.find(f => f.entrada && f.salida);

    if(fichajeAbierto){
      estado = "TRABAJANDO";
    } else if(fichajeCerrado){
      const horasTexto = calcularHorasRedondeadasDesdeFichaje(fichajeCerrado);
      estado = "SALIO, " + horasTexto + " H";
    }

    const boton = document.createElement("button");
    boton.className = "botonTrabajador";
    boton.textContent = trabajador.nombre + " — " + estado;
    boton.addEventListener("click", () => abrirFichaTrabajador(trabajador));
    listaTrabajandoDiv.appendChild(boton);
  });

  modalTrabajando.classList.remove("oculto");
}

inputs.forEach((input, index) => {
  input.addEventListener("input", () => {
    input.value = input.value.replace(/[^0-9]/g, "");
    if(input.value && index < inputs.length - 1){
      inputs[index + 1].focus();
    }
  });

  input.addEventListener("keydown", (e) => {
    if(e.key === "Backspace" && !input.value && index > 0){
      inputs[index - 1].focus();
    }
  });
});

async function entrarApp(){
  let pin = "";
  inputs.forEach(input => { pin += input.value; });

  if(pin.length !== 4){
    mensajeLogin.textContent = "Introduce el PIN completo";
    return;
  }

  if(pin === PIN_ENCARGADO){
    mensajeLogin.textContent = "";
    pantallaLogin.classList.add("oculto");
    pantallaEncargado.classList.remove("oculto");
    await cargarObras();
    return;
  }

  const { data, error } = await supabaseClient
    .from("trabajadores")
    .select("*")
    .eq("pin", pin)
    .eq("activo", true)
    .maybeSingle();

  if(error){
    console.log(error);
    mensajeLogin.textContent = "Error conectando";
    return;
  }

  if(!data){
    mensajeLogin.textContent = "PIN incorrecto";
    return;
  }

  trabajadorActual = data;
  nombreTrabajadorActual = data.nombre || "TRABAJADOR";
  obraTrabajadorActual = await cargarObraDeTrabajador(data.obra);

  mensajeLogin.textContent = "";
  mensajeTrabajador.textContent = "";
  pantallaLogin.classList.add("oculto");
  pantallaTrabajador.classList.remove("oculto");

  if(!obraTrabajadorActual){
    mensajeTrabajador.textContent = "No se encontró la obra del trabajador";
  }

  await cargarEstadoTrabajadorActual();
}

async function ficharEntrada(){
  mensajeTrabajador.textContent = "";

  if(!trabajadorActual){
    mensajeTrabajador.textContent = "No se encontró el trabajador";
    return;
  }

  if(!obraTrabajadorActual){
    mensajeTrabajador.textContent = "No se encontró la obra del trabajador";
    return;
  }

  try{
    mensajeTrabajador.textContent = "Comprobando ubicación...";
    await comprobarUbicacionDentroDeObra(obraTrabajadorActual);

    const fecha = hoyString();

    const { data: fichajesHoy, error: errorBuscar } = await supabaseClient
      .from("fichajes")
      .select("*")
      .eq("trabajador", trabajadorActual.nombre)
      .eq("obra", trabajadorActual.obra)
      .eq("fecha", fecha)
      .order("entrada", { ascending: false });

    if(errorBuscar){
      console.log(errorBuscar);
      mensajeTrabajador.textContent = "Error comprobando fichaje";
      return;
    }

    const abierto = (fichajesHoy || []).find(f => f.entrada && !f.salida);
    const cerrado = (fichajesHoy || []).find(f => f.entrada && f.salida);

    if(abierto){
      mensajeTrabajador.textContent = "Ya has fichado entrada hoy";
      await cargarEstadoTrabajadorActual();
      return;
    }

    if(cerrado){
      mensajeTrabajador.textContent = "Ya has completado el fichaje de hoy";
      await cargarEstadoTrabajadorActual();
      return;
    }

    const { error: errorInsert } = await supabaseClient
      .from("fichajes")
      .insert([{
        trabajador: trabajadorActual.nombre,
        obra: trabajadorActual.obra,
        fecha: fecha,
        entrada: ahoraISO()
      }]);

    if(errorInsert){
      console.log(errorInsert);
      mensajeTrabajador.textContent = "Error guardando entrada";
      return;
    }

    mensajeTrabajador.textContent = "Entrada registrada correctamente";
    await cargarEstadoTrabajadorActual();
  }catch(error){
    console.log(error);
    mensajeTrabajador.textContent = error.message || "No se pudo comprobar la ubicación";
  }
}

async function ficharSalida(){
  mensajeTrabajador.textContent = "";

  if(!trabajadorActual){
    mensajeTrabajador.textContent = "No se encontró el trabajador";
    return;
  }

  if(!obraTrabajadorActual){
    mensajeTrabajador.textContent = "No se encontró la obra del trabajador";
    return;
  }

  try{
    mensajeTrabajador.textContent = "Comprobando ubicación...";
    await comprobarUbicacionDentroDeObra(obraTrabajadorActual);

    const fecha = hoyString();

    const { data: fichajesHoy, error: errorBuscar } = await supabaseClient
      .from("fichajes")
      .select("*")
      .eq("trabajador", trabajadorActual.nombre)
      .eq("obra", trabajadorActual.obra)
      .eq("fecha", fecha)
      .order("entrada", { ascending: false });

    if(errorBuscar){
      console.log(errorBuscar);
      mensajeTrabajador.textContent = "Error comprobando fichaje";
      return;
    }

    const abierto = (fichajesHoy || []).find(f => f.entrada && !f.salida);

    if(!abierto){
      mensajeTrabajador.textContent = "No tienes una entrada abierta hoy";
      await cargarEstadoTrabajadorActual();
      return;
    }

    const salidaISO = ahoraISO();
    const fichajeCalculado = { ...abierto, salida: salidaISO };
    const horasRedondeadas = calcularHorasRedondeadasDesdeFichaje(fichajeCalculado);

    const { error: errorUpdate } = await supabaseClient
      .from("fichajes")
      .update({
        salida: salidaISO,
        horas: horasRedondeadas,
        horas_redondeadas: horasRedondeadas
      })
      .eq("id", abierto.id);

    if(errorUpdate){
      console.log(errorUpdate);
      mensajeTrabajador.textContent = "Error guardando salida";
      return;
    }

    mensajeTrabajador.textContent = "Salida registrada correctamente";
    await cargarEstadoTrabajadorActual();
  }catch(error){
    console.log(error);
    mensajeTrabajador.textContent = error.message || "No se pudo comprobar la ubicación";
  }
}

async function verHorasSemanaTrabajador(){
  if(!trabajadorActual) return;

  const hoy = new Date();
  const inicioSemana = obtenerInicioSemana(hoy);
  const finSemana = new Date(inicioSemana);
  finSemana.setDate(finSemana.getDate() + 6);

  const fechaInicio = formatearFechaYYYYMMDD(inicioSemana);
  const fechaFin = formatearFechaYYYYMMDD(finSemana);

  const { data, error } = await supabaseClient
    .from("fichajes")
    .select("*")
    .eq("trabajador", trabajadorActual.nombre)
    .eq("obra", trabajadorActual.obra)
    .gte("fecha", fechaInicio)
    .lte("fecha", fechaFin);

  if(error){
    console.log(error);
    btnSemana.textContent = "SEMANA: 0 H";
    setTimeout(() => { btnSemana.textContent = "HORAS SEMANA"; }, 5000);
    return;
  }

  const horasPorDia = construirHorasPorFecha(data || []);
  let total = 0;
  Object.values(horasPorDia).forEach(h => total += Number(h || 0));

  btnSemana.textContent = "SEMANA: " + total + " H";
  setTimeout(() => { btnSemana.textContent = "HORAS SEMANA"; }, 5000);
}

async function verHorasMesTrabajador(){
  if(!trabajadorActual) return;

  const hoy = new Date();
  const primerDia = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
  const ultimoDia = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0);

  const fechaInicio = formatearFechaYYYYMMDD(primerDia);
  const fechaFin = formatearFechaYYYYMMDD(ultimoDia);

  const { data, error } = await supabaseClient
    .from("fichajes")

}

async function añadirObra(){
  const nombreObra = prompt("Nombre de la obra");
  if(!nombreObra) return;

  const latitud = prompt("Latitud de la obra");
  if(!latitud) return;

  const longitud = prompt("Longitud de la obra");
  if(!longitud) return;

  const radioFichaje = prompt("Radio de fichaje en metros");
  if(!radioFichaje) return;

  const { error } = await supabaseClient
    .from("obras")
    .insert([{
      nombre: nombreObra.trim(),
      latitud: parseFloat(latitud),
      longitud: parseFloat(longitud),
      radio_fichaje: parseFloat(radioFichaje)
    }]);

  if(error){
    console.log(error);
    alert("Error al crear la obra: " + (error.message || ""));
    return;
  }

  alert("Obra creada correctamente");
  await cargarObras();
}

async function añadirTrabajador(){
  if(!obraSeleccionada){
    alert("Selecciona primero una obra");
    return;
  }

  const nombre = prompt("Nombre del trabajador");
  if(!nombre) return;

  const pin = prompt("PIN del trabajador (4 números)");
  if(!pin) return;

  const precioHora = prompt("Precio por hora");
  if(!precioHora) return;

  const telefono = prompt("Teléfono");
  if(!telefono) return;

  const datosTrabajador = {
    nombre: nombre.trim(),
    pin: pin.trim(),
    obra: obraSeleccionada,
    precio_hora: parseFloat(precioHora),
    telefono: telefono.trim(),
    movil_id: null,
    activo: true
  };

  const { error } = await supabaseClient
    .from("trabajadores")
    .insert([datosTrabajador]);

  if(error){
    console.log(error);
    alert(
      "Error al crear trabajador:\n\n" +
      (error.message || "") + "\n\n" +
      (error.details || "") + "\n\n" +
      (error.hint || "")
    );
    return;
  }

  alert("Trabajador creado correctamente en la obra " + obraSeleccionada);
}
