<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUXOIS Control de Obras</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
background:black;
display:flex;
justify-content:center;
align-items:center;
font-family:'Cinzel', serif;
color:#f0b33a;
}

.loginBox{
width:100%;
max-width:420px;
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
padding:40px;
}

.logo{
font-size:64px;
margin:0;
letter-spacing:2px;
}

.sublogo{
font-size:22px;
margin-bottom:90px;
letter-spacing:3px;
}

.pinTitle{
font-size:30px;
margin-bottom:30px;
letter-spacing:6px;
}

.pinRow{
display:flex;
gap:20px;
margin-bottom:20px;
}

.pinInput{
width:50px;
height:50px;
border:none;
border-bottom:3px solid #f0b33a;
background:transparent;
color:#f0b33a;
font-size:32px;
text-align:center;
outline:none;
font-family:'Cinzel', serif;
}

.pinDots{
display:flex;
gap:18px;
margin-bottom:80px;
}

.pinDots span{
width:12px;
height:12px;
background:#f0b33a;
border-radius:50%;
box-shadow:0 0 8px #f0b33a;
}

.entrarBtn{
padding:14px 40px;
font-size:22px;
letter-spacing:2px;
background:black;
border:2px solid #f0b33a;
color:#f0b33a;
cursor:pointer;
font-family:'Cinzel', serif;
}

.entrarBtn:hover{
background:#f0b33a;
color:black;
}

.mensaje{
margin-top:20px;
font-size:14px;
}

</style>
</head>

<body>

<div class="loginBox">

<h1 class="logo">LUXOIS</h1>
<h2 class="sublogo">CONTROL DE OBRAS</h2>

<h3 class="pinTitle">PIN</h3>

<div class="pinRow">
<input class="pinInput" maxlength="1" inputmode="numeric">
<input class="pinInput" maxlength="1" inputmode="numeric">
<input class="pinInput" maxlength="1" inputmode="numeric">
<input class="pinInput" maxlength="1" inputmode="numeric">
</div>

<div class="pinDots">
<span></span>
<span></span>
<span></span>
<span></span>
</div>

<button class="entrarBtn" onclick="entrar()">ENTRAR</button>

<div id="mensaje" class="mensaje"></div>

</div>

<script>

const inputs = document.querySelectorAll(".pinInput");
const mensaje = document.getElementById("mensaje");

inputs.forEach((input, index)=>{

input.addEventListener("input",()=>{

input.value=input.value.replace(/[^0-9]/g,"");

if(input.value && index<inputs.length-1){
inputs[index+1].focus();
}

});

input.addEventListener("keydown",(e)=>{

if(e.key==="Backspace" && !input.value && index>0){
inputs[index-1].focus();
}

});

});

function entrar(){

let pin="";

inputs.forEach(input=>{
pin+=input.value;
});

if(pin.length!==4){
mensaje.textContent="Introduce el PIN completo";
return;
}

mensaje.textContent="PIN introducido: "+pin;

}

</script>

</body>
</html>
